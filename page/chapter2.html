<body class="deck" data-chapter="CHAPTER 2" data-scene-offset="3" data-prev="index.html#s6" data-next="index.html#s7">

  <div class="stage">
    <!-- 1 -->

      <p class="kicker" style="--x:8%;--y:12%">Chapter 2</p>

      <div class="media" data-step style="--x:6%;--y:24%;--w:780px;--r:-3deg">IMAGE / VIDEO</div>
      <div class="meta">
        <span class="tag" data-step style="--x:50%;--y:58%;--w:auto">切り口（仮）</span>
        <h2 data-step style="--x:46%;--y:63%;--w:760px">作品名（仮）</h2>
        <p class="credit" data-step style="--x:50%;--y:78%">作者名 ／ 20XX</p>
        <p data-step style="--x:48%;--y:85%;--w:640px">作品の一言解説がここに入ります。</p>
      </div>
    </section>

    <!-- 3 -->
    <section class="slide work">
      <div class="media" data-step style="--x:5%;--y:16%;--w:700px;--r:2deg">IMAGE / VIDEO</div>
      <div class="meta">
        <span class="tag" data-step style="--x:8%;--y:68%;--w:auto">切り口（仮）</span>

      <div class="media" style="--x:6%;--y:20%;--w:820px;--r:-2deg"><canvas width="1000" height="562" data-sketch="trail"></canvas></div>
      <div class="meta">
        <span class="tag" style="--x:8%;--y:72%;--w:auto">DEMO</span>
        <h2 style="--x:8%;--y:79%;--w:500px">触れる表現</h2>
        <p class="dim" data-step style="--x:38%;--y:78%;--w:700px">マウスを動かしてみてください。<br />スライドの中でも、リアルタイムに描画できます。</p>
      </div>
    </section>

    <section class="slide">
